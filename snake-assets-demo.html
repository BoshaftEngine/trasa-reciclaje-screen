<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRASA SNAKE · Prueba de imágenes</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#121c16;color:#e9f4df;font-family:Arial,Helvetica,sans-serif}
main{width:min(690px,96%);margin:15px auto 30px;text-align:center}h1{letter-spacing:.06em;margin-bottom:6px}p{line-height:1.3;color:#adc0aa}
canvas{display:block;width:min(100%,67vh,560px);height:auto;margin:10px auto;border:2px solid #71856c;border-radius:10px;image-rendering:pixelated;touch-action:none;background:#183122}
.controls{display:grid;grid-template-columns:repeat(3,68px);grid-template-rows:repeat(2,50px);gap:8px;justify-content:center}
button{font:700 20px Arial,sans-serif;color:#edf7e5;background:#425c40;border:1px solid #9bac92;border-radius:8px;cursor:pointer;touch-action:none}
.controls button:nth-child(1){grid-column:2;grid-row:1}.controls button:nth-child(2){grid-column:1;grid-row:2}.controls button:nth-child(3){grid-column:2;grid-row:2}.controls button:nth-child(4){grid-column:3;grid-row:2}
#restart{margin:16px auto 10px;padding:12px 24px}#info{font-weight:bold;color:#b9d19f}
</style></head><body><main><h1>TRASA SNAKE · PRUEBA DE SPRITES</h1><p>Esta página sirve para comprobar tus PNG antes de publicarlos. Usa WASD / flechas, desliza el dedo o pulsa los botones.</p>
<div id="info">Cargando…</div><canvas id="preview" width="576" height="576"></canvas>
<div class="controls"><button data-dir="0">▲</button><button data-dir="3">◀</button><button data-dir="2">▼</button><button data-dir="1">▶</button></div>
<button id="restart">NUEVA PARTIDA</button><p>Cambia los PNG de <code>assets/trasa-snake/</code> conservando sus nombres. No modifica Firebase.</p>
</main><script type="module" src="js/snake-assets-demo.js?v=15"></script></body></html>
